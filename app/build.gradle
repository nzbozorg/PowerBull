plugins { id 'com.android.application' }
android {
 namespace 'com.powerbull.app'
 compileSdk 35
 defaultConfig { applicationId 'com.powerbull.app'; minSdk 28; targetSdk 35; versionCode 2; versionName '1.0.1' }
 signingConfigs { release { storeFile file('../signing/powerbull-release.jks'); storePassword System.getenv('PB_STORE_PASSWORD') ?: ''; keyAlias 'powerbull'; keyPassword System.getenv('PB_STORE_PASSWORD') ?: '' } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
